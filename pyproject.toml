[project]
name = "chromamcp"
version = "0.0.1"
description = "MCP server for chromatographic data: system-suitability metrics with cited formulas"
requires-python = ">=3.13"
# Deliberately bounded by SCHEDULE.md W0.1: W1 adds the mzML reader, numpy and a
# serialiser — and nothing else without a recorded reason.  An unused dependency is
# not free, so the scaffold ships none.
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]
dev = [
    "chromamcp[test]",
    "ruff>=0.11",
    "mypy>=1.15",
    "basedpyright>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chromamcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.basedpyright]
# Mirrors the MSMCP configuration so `make lint` catches the same error classes the
# editor reports.  pyright's `exclude` REPLACES its defaults rather than extending
# them, so the defaults are restated here.
typeCheckingMode = "standard"
pythonVersion = "3.13"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
